{% extends 'base.html' %}

{% block content %}

<div class="Container my-5">
    <h2>Browse Events</h2>

    <ul>
        {% for event in events %}
        <li> {{ event.title }} ({{ event.status }}) - {{ event.start.strftime('%d %b %Y') }}</li>
        {% else %}
        <li> No events yet. </li>
        {% endfor %}
    </ul>

</div>

{% endblock %}
