{% extends 'base.html' %}
{% from "bootstrap5/form.html" import render_form %}
{% block content %}
<div class="container">
    <div class="col-md-8">
        <div class="page-header">
            <h4>{{heading}}</h4>
        </div>

        <!-- Form rendering is simple and easy if using WTForms and Bootstrap -->
        <div class="col-md-6">
            {{render_form(form)}}
        </div>

        <!-- When you have Login form, then show the user a link to register -->
        <div class="col-md-4">
            {% if heading == 'Login' %}
            <p>New user? <a href="{{url_for('auth.register')}}">Click here</a> to register.</p>
            {% else %}
            <p>Already have an account? <a href="{{url_for('auth.login')}}">Click here</a> to log in.</p>
            {% endif %}
        </div>
    </div>
</div>
{% endblock %}
